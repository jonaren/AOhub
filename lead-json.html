    <script>
        let videoData = {};
        let currentVideoIndex = {};

        // Convert Google Sheets URL to CSV export URL
        function convertToCSVUrl(sheetUrl) {
            // If it's already a published CSV URL, use it directly
            if (sheetUrl.includes('pub?output=csv') || sheetUrl.includes('export?format=csv')) {
                return sheetUrl;
            }
            
            // Extract the sheet ID from various Google Sheets URL formats
            let sheetId = '';
            
            if (sheetUrl.includes('/spreadsheets/d/')) {
                const match = sheetUrl.match(/\/spreadsheets\/d\/([a-zA-Z0-9-_]+)/);
                if (match) sheetId = match[1];
            }
            
            if (!sheetId) {
                throw new Error('Invalid Google Sheets URL. Please make sure you\'re using a valid Google Sheets link.');
            }
            
            // Return CSV export URL
            return `https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv`;
        }

        // Load data from Google Sheets automatically
        async function loadFromGoogleSheets() {
            const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRuCWi1oN5MxulX4MCXW0wQWOsvFuoMn8yn0J2FzjoBro0115ydjiJ4ZHY29VuFBnH2f732Ytx8uNFr/pub?output=csv';

            try {
                showLoading(true);
                hideError();
                
                const response = await fetch(sheetUrl);
                
                if (!response.ok) {
                    throw new Error(`Failed to fetch data: ${response.status} ${response.statusText}`);
                }
                
                const csvText = await response.text();
                const data = parseCSV(csvText);
                
                videoData = processVideoData(data);
                initializeVideoLibrary();
                
                showLoading(false);
                
                // Add class to body to indicate video library is loaded
                document.body.classList.add('video-library-loaded');
                
                // Trigger custom event for external CSS
                setTimeout(() => {
                    window.dispatchEvent(new CustomEvent('videoLibraryReady', {
                        detail: { categories: Object.keys(videoData) }
                    }));
                }, 200);
                
            } catch (error) {
                showLoading(false);
                showError(`Error loading data: ${error.message}`);
                console.error('Error:', error);
            }
        }

        // Improved CSV parser to handle quoted fields and commas
        function parseCSV(csvText) {
            const lines = csvText.trim().split('\n');
            const result = [];
            
            // Parse header row
            const headers = parseCSVLine(lines[0]);
            
            // Parse data rows
            for (let i = 1; i < lines.length; i++) {
                if (lines[i].trim()) {
                    const values = parseCSVLine(lines[i]);
                    const row = {};
                    headers.forEach((header, index) => {
                        row[header.trim()] = (values[index] || '').trim();
                    });
                    result.push(row);
                }
            }
            
            return result;
        }
        
        // Parse a single CSV line handling quotes and embedded commas
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            let i = 0;
            
            while (i < line.length) {
                const char = line[i];
                
                if (char === '"') {
                    if (inQuotes && line[i + 1] === '"') {
                        // Escaped quote
                        current += '"';
                        i += 2;
                    } else {
                        // Toggle quote state
                        inQuotes = !inQuotes;
                        i++;
                    }
                } else if (char === ',' && !inQuotes) {
                    // End of field
                    result.push(current);
                    current = '';
                    i++;
                } else {
                    current += char;
                    i++;
                }
            }
            
            // Add the last field
            result.push(current);
            
            return result;
        }

        // Process CSV data into video structure
        function processVideoData(data) {
            const processedData = {};
            
            data.forEach(row => {
                const originalCategory = row.category || 'uncategorized';
                // Create a safe category ID for CSS selectors
                const safeCategoryId = originalCategory.toLowerCase()
                    .replace(/\s+/g, '-')           // Replace spaces with hyphens
                    .replace(/[^a-z0-9\-]/g, '')    // Remove special characters
                    .replace(/\-+/g, '-')           // Replace multiple hyphens with single
                    .replace(/^\-|\-$/g, '');       // Remove leading/trailing hyphens
                
                if (!processedData[safeCategoryId]) {
                    processedData[safeCategoryId] = {
                        displayName: originalCategory,
                        videos: []
                    };
                }
                
                processedData[safeCategoryId].videos.push({
                    id: row.video_url || row.id || '',
                    title: row.title || 'Untitled',
                    description: row.description || ''
                });
            });
            
            return processedData;
        }

        // Initialize the video library interface
        function initializeVideoLibrary() {
            const categories = Object.keys(videoData);
            
            if (categories.length === 0) {
                showError('No video categories found in the data');
                return;
            }
            
            // Generate category buttons
            generateCategoryButtons(categories);
            
            // Generate video sections
            generateVideoSections(categories);
            
            // Initialize current video index for each category
            categories.forEach(category => {
                currentVideoIndex[category] = 0;
            });
            
            // Show the interface
            document.getElementById('categoryButtons').style.display = 'block';
            
            // Force reload external CSS after dynamic content is loaded
            forceReloadExternalCSS();
            
            // Auto-select first category
            setTimeout(() => {
                const firstBtn = document.querySelector('.category-btn');
                if (firstBtn) {
                    firstBtn.click();
                }
            }, 100);
        }
        
        // Force reload and apply external CSS after dynamic content loads
        function forceReloadExternalCSS() {
            // Method 1: Trigger CSS recalculation
            document.body.style.display = 'none';
            document.body.offsetHeight; // Force reflow
            document.body.style.display = '';
            
            // Method 2: Re-add external stylesheets
            const links = document.querySelectorAll('link[rel="stylesheet"]');
            links.forEach(link => {
                if (link.href && !link.href.includes('cdnjs.cloudflare.com')) {
                    const newLink = link.cloneNode();
                    newLink.href = link.href + (link.href.includes('?') ? '&' : '?') + 'refresh=' + Date.now();
                    link.parentNode.insertBefore(newLink, link.nextSibling);
                    setTimeout(() => link.remove(), 100);
                }
            });
            
            // Method 3: Fire custom event for CSS reapplication
            window.dispatchEvent(new Event('videoLibraryLoaded'));
            
            console.log('External CSS reload forced after video library initialization');
        }

        // Generate category buttons dynamically
        function generateCategoryButtons(categories) {
            const container = document.getElementById('categoryButtonsContainer');
            container.innerHTML = '';
            
            categories.forEach(categoryId => {
                const categoryData = videoData[categoryId];
                const button = document.createElement('button');
                button.className = 'btn category-btn';
                button.setAttribute('data-category', categoryId);
                button.textContent = categoryData.displayName;
                
                button.addEventListener('click', function() {
                    const selectedCategory = this.dataset.category;
                    showCategory(selectedCategory);
                    
                    // Update button states
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                });
                
                container.appendChild(button);
            });
        }

        // Format category name for display
        function formatCategoryName(category) {
            return category
                .replace(/([A-Z])/g, ' $1')
                .replace(/^./, str => str.toUpperCase())
                .trim();
        }

        // Generate video sections dynamically
        function generateVideoSections(categories) {
            const container = document.getElementById('videoSections');
            container.innerHTML = '';
            
            categories.forEach(category => {
                const section = createVideoSection(category);
                container.appendChild(section);
            });
        }

        // Create a video section element
        function createVideoSection(categoryId) {
            const categoryData = videoData[categoryId];
            const section = document.createElement('div');
            section.className = 'video-section';
            section.id = categoryId;
            
            section.innerHTML = `
                <div class="row justify-content-center">
                    <div class="col-lg-8 col-md-10 col-12">
                        <h2 class="category-title">${categoryData.displayName}</h2>
                        <div class="video-carousel">
                            <div class="carousel-controls">
                                <button class="carousel-btn" id="prevBtn-${categoryId}" disabled>
                                    <i class="fas fa-chevron-left"></i> Previous
                                </button>
                                <div class="video-counter">
                                    <span id="currentVideo-${categoryId}">1</span> of <span id="totalVideos-${categoryId}">0</span>
                                </div>
                                <button class="carousel-btn" id="nextBtn-${categoryId}">
                                    Next <i class="fas fa-chevron-right"></i>
                                </button>
                            </div>
                            
                            <div class="progress-indicator" id="progress-${categoryId}"></div>
                            
                            <div class="video-info">
                                <h3 class="video-title" id="videoTitle-${categoryId}">Loading...</h3>
                                <p class="video-description" id="videoDesc-${categoryId}">Loading video information...</p>
                            </div>
                            
                            <div class="video-container">
                                <iframe id="videoFrame-${categoryId}" src="" allowfullscreen></iframe>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            
            return section;
        }

        function showCategory(category) {
            // Hide all video sections
            document.querySelectorAll('.video-section').forEach(section => {
                section.classList.remove('active');
            });
            
            // Show selected category with animation delay
            setTimeout(() => {
                document.getElementById(category).classList.add('active');
                initializeCategory(category);
            }, 200);
        }

        function initializeCategory(category) {
            const categoryData = videoData[category];
            const videos = categoryData ? categoryData.videos : [];
            const totalVideos = videos.length;
            
            console.log(`Initializing category: ${category} (${categoryData.displayName}) with ${totalVideos} videos`);
            
            if (totalVideos === 0) {
                showError(`No videos found for category: ${categoryData.displayName}`);
                return;
            }
            
            // Initialize current video index for this category
            currentVideoIndex[category] = 0;
            
            // Update total video count
            const totalElement = document.getElementById(`totalVideos-${category}`);
            if (totalElement) {
                totalElement.textContent = totalVideos;
            }
            
            // Create progress dots
            createProgressDots(category, totalVideos);
            
            // Load first video
            loadVideo(category, 0);
            
            // Setup navigation buttons - do this after loading the video
            setTimeout(() => {
                setupNavigation(category);
            }, 100);
        }

        function createProgressDots(category, count) {
            const progressContainer = document.getElementById(`progress-${category}`);
            if (!progressContainer) return;
            
            progressContainer.innerHTML = '';
            
            for (let i = 0; i < count; i++) {
                const dot = document.createElement('div');
                dot.className = 'progress-dot';
                if (i === 0) dot.classList.add('active');
                
                // Use closure to capture the correct index
                dot.addEventListener('click', (function(index) {
                    return function() {
                        loadVideo(category, index);
                    };
                })(i));
                
                progressContainer.appendChild(dot);
            }
        }

        function setupNavigation(category) {
            console.log(`Setting up navigation for category: ${category}`);
            
            const prevBtn = document.getElementById(`prevBtn-${category}`);
            const nextBtn = document.getElementById(`nextBtn-${category}`);
            
            if (!prevBtn || !nextBtn) {
                console.error(`Navigation buttons not found for category: ${category}`);
                return;
            }
            
            // Clear any existing event handlers
            prevBtn.onclick = null;
            nextBtn.onclick = null;
            
            // Set up new event handlers with proper error handling
            prevBtn.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log(`Previous button clicked for category: ${category}`);
                
                if (!this.disabled) {
                    navigateVideo(category, -1);
                }
                return false;
            };
            
            nextBtn.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();
                console.log(`Next button clicked for category: ${category}`);
                
                if (!this.disabled) {
                    navigateVideo(category, 1);
                }
                return false;
            };
            
            console.log(`Navigation setup complete for ${category}`);
        }

        function navigateVideo(category, direction) {
            console.log(`Navigating video for ${category}, direction: ${direction}`);
            
            const categoryData = videoData[category];
            const videos = categoryData ? categoryData.videos : [];
            const currentIndex = currentVideoIndex[category] || 0;
            const newIndex = currentIndex + direction;
            
            console.log(`Current index: ${currentIndex}, New index: ${newIndex}, Total videos: ${videos.length}`);
            
            // Check bounds
            if (newIndex < 0 || newIndex >= videos.length) {
                console.log(`Navigation blocked - out of bounds`);
                return; // Don't navigate if out of bounds
            }
            
            console.log(`Loading video at index: ${newIndex}`);
            loadVideo(category, newIndex);
        }

        function loadVideo(category, index) {
            const categoryData = videoData[category];
            const videos = categoryData ? categoryData.videos : [];
            const video = videos[index];
            
            if (!video) return;
            
            currentVideoIndex[category] = index;
            
            // Update video frame
            const videoFrame = document.getElementById(`videoFrame-${category}`);
            if (videoFrame) {
                videoFrame.src = video.id;
            }
            
            // Update video info
            const titleElement = document.getElementById(`videoTitle-${category}`);
            const descElement = document.getElementById(`videoDesc-${category}`);
            const currentElement = document.getElementById(`currentVideo-${category}`);
            
            if (titleElement) titleElement.textContent = video.title;
            if (descElement) {
                if (video.description.includes('<a')) {
                    descElement.innerHTML = video.description;
                } else {
                    descElement.textContent = video.description;
                }
            }
            if (currentElement) currentElement.textContent = index + 1;
            
            // Update progress dots
            const progressDots = document.querySelectorAll(`#progress-${category} .progress-dot`);
            progressDots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
            
            // Update navigation buttons state
            updateNavigationButtons(category, index, videos.length);
        }
        
        function updateNavigationButtons(category, currentIndex, totalVideos) {
            const prevBtn = document.getElementById(`prevBtn-${category}`);
            const nextBtn = document.getElementById(`nextBtn-${category}`);
            
            console.log(`Updating navigation buttons for ${category}: ${currentIndex + 1}/${totalVideos}`);
            
            if (prevBtn && nextBtn) {
                const isFirstVideo = currentIndex === 0;
                const isLastVideo = currentIndex === totalVideos - 1;
                
                prevBtn.disabled = isFirstVideo;
                nextBtn.disabled = isLastVideo;
                
                // Update button styling based on disabled state
                if (isFirstVideo) {
                    prevBtn.style.opacity = '0.5';
                    prevBtn.style.cursor = 'not-allowed';
                } else {
                    prevBtn.style.opacity = '1';
                    prevBtn.style.cursor = 'pointer';
                }
                
                if (isLastVideo) {
                    nextBtn.style.opacity = '0.5';
                    nextBtn.style.cursor = 'not-allowed';
                } else {
                    nextBtn.style.opacity = '1';
                    nextBtn.style.cursor = 'pointer';
                }
                
                console.log(`Previous button ${isFirstVideo ? 'disabled' : 'enabled'}, Next button ${isLastVideo ? 'disabled' : 'enabled'}`);
            } else {
                console.error(`Navigation buttons not found for category: ${category}`);
            }
        }

        // Utility functions
        function showLoading(show) {
            document.getElementById('loadingMessage').style.display = show ? 'block' : 'none';
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
        }

        function hideError() {
            document.getElementById('errorMessage').style.display = 'none';
        }

        // Load your data on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Auto-load the data from Google Sheets
            loadFromGoogleSheets();
        });
    </script>
